# Fly Machines configuration for the renderer. Deploy from the repository root:
#   fly deploy --config fly.render.toml --remote-only --ha=false
# Secret (set once):  fly secrets set RENDER_TOKEN=<random> -a php2shell-render
app = "php2shell-render"
primary_region = "iad"

[build]
  dockerfile = "render/Dockerfile"

[env]
  PORT = "8790"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
