# The edge. Deploy from the repository root after `bun run build`:
#   bunx wrangler deploy
# Secrets (never in files):  bunx wrangler secret put ENGINE_TOKEN ; bunx wrangler secret put RENDER_TOKEN
name = "php2shell-labs"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ENGINE_URL = "https://php2shell-engine.fly.dev"
RENDER_URL = "https://php2shell-render.fly.dev"
PUBLIC_ORIGIN = "https://php2shell-labs.taptok-test.workers.dev"
ALLOWED_PORTS = "80,443"

[[d1_databases]]
binding = "DB"
database_name = "php2shell"
database_id = "0dc63c6c-fd13-4c48-988a-73e82ff240ee"

[observability]
enabled = true
